<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sethu — a command bridge">
  <title>sethu — a command bridge</title>
  <!-- Rounded app-icon background -->
  <rect width="512" height="512" rx="112" fill="#0d1b2a"/>

  <!-- Water under the bridge -->
  <rect x="64" y="356" width="384" height="40" rx="20" fill="#1b3a5b"/>

  <!-- Bridge deck -->
  <rect x="64" y="300" width="384" height="26" rx="13" fill="#4FB0E8"/>

  <!-- Suspension cables (the span) -->
  <path d="M88 300 C 176 196, 336 196, 424 300" stroke="#4FB0E8" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Vertical hangers -->
  <g stroke="#4FB0E8" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <line x1="146" y1="252" x2="146" y2="300"/>
    <line x1="201" y1="224" x2="201" y2="300"/>
    <line x1="256" y1="214" x2="256" y2="300"/>
    <line x1="311" y1="224" x2="311" y2="300"/>
    <line x1="366" y1="252" x2="366" y2="300"/>
  </g>
  <!-- Towers -->
  <rect x="138" y="196" width="16" height="130" rx="8" fill="#7fc7ee"/>
  <rect x="358" y="196" width="16" height="130" rx="8" fill="#7fc7ee"/>

  <!-- The prompt mark: ">" in warm orange, the command crossing the bridge -->
  <path d="M212 372 L 268 410 L 212 448" stroke="#F0883E" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor block -->
  <rect x="286" y="386" width="34" height="48" rx="6" fill="#F0883E"/>
</svg>
