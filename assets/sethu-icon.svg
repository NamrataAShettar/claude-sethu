  <text x="100" y="42" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace"
        font-size="40" font-weight="700" letter-spacing="3" fill="#00afaf">|^=^|</text>
</svg>
