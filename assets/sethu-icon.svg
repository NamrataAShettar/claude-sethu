<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" role="img" aria-label="sethu, the |^=^| bridge icon">
  <title>sethu</title>
  <!-- The literal |^=^| icon (towers with cables dipping to the deck) in sethu's
