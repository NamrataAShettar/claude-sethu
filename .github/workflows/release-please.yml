name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Never cancel a release mid-cut (cancel-in-progress: false).
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Don't run in forks — only this repo should cut releases.
    if: github.repository == 'NamrataAShettar/claude-sethu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
