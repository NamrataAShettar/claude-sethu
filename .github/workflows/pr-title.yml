name: pr-title

# Enforce Conventional-Commit PR titles. Because PRs are squash-merged, the PR title
# becomes the commit on main, which is what release-please reads to decide the next
# version. A title with no known type (fix/feat/…) would be silently ignored (no bump,
# no changelog), so a real change could ship unversioned. This check fails the PR the
# moment it's opened (or its title is edited) and posts an explanatory comment, so a bad
# title is caught immediately instead of at release time. See docs/versioning.md.
#
# Make it blocking by requiring the `pr-title` check in the branch-protection rule for
# `main` (a red check alone does not stop a merge without that).

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (this runs on pull_request_target with a write token, so a mutable
      # tag would be a supply-chain risk). Bump via Dependabot. Currently v5.
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        id: lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            chore
            test
            refactor
            ci
            build
            perf
            style
            revert
          requireScope: false

      # On failure, post (or update) a sticky comment on the PR explaining the fix, so
      # the author sees a clear error at open time, not just a red check.
      - if: always() && steps.lint.outputs.error_message != null
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: pr-title-lint
          message: |
            ⚠️ **This PR title is not a valid [Conventional Commit](https://www.conventionalcommits.org).**

            The title becomes the squash-merge commit, and release-please reads it to pick
            the next version, so it must start with a type prefix:

            - `fix: …` (patch) · `feat: …` (minor) · `feat!: …` or `BREAKING CHANGE:` (breaking)
            - `docs:` · `chore:` · `test:` · `refactor:` · `ci:` (no release)

            Edit the PR title to add a valid prefix and this check re-runs. Full guide:
            `docs/versioning.md`.

            <sub>Details: ${{ steps.lint.outputs.error_message }}</sub>

      # Once the title is valid, remove the sticky comment.
      - if: ${{ steps.lint.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: pr-title-lint
          delete: true
