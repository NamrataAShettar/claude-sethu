name: pr-title

# Enforce Conventional-Commit PR titles. Because PRs are squash-merged, the PR title
# becomes the commit on main, which is what release-please reads to decide the next
# version. A title with no known type (fix/feat/…) would be silently ignored (no bump,
# no changelog), so a real change could ship unversioned — this check fails the PR
# instead, catching it before merge. See docs/versioning.md.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            chore
            test
            refactor
            ci
            build
            perf
            style
            revert
          requireScope: false
