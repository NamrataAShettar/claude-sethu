name: tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  # No paths-ignore on PRs: tests run on EVERY PR (even docs-only) so the `test` check
  # always reports and can be a required status check in branch protection. Without this
  # a docs-only PR would skip the check and, if it were required, block the merge forever.
  # (Push to main still skips CI for doc-only changes, above.)
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Python syntax
        run: python -m compileall -q hooks
      - name: Run tests
        run: python -m unittest discover -s tests -v
